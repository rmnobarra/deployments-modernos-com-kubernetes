# argocd-apps/demo-app-dev.yaml
# Application que conecta o repo Git ao cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-dev
  namespace: argocd              # Applications SEMPRE ficam no namespace do ArgoCD
  # Finalizer garante que os recursos do cluster são deletados
  # quando a Application é removida
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project define as permissões desta aplicação
  project: default
  
  # SOURCE: de onde vem a configuração
  source:
    repoURL: https://github.com/rmnobarra/deployments-modernos-com-kubernetes.git
    targetRevision: main          # Branch, tag, ou commit SHA
    path: apps/demo-app/overlays/dev  # Path dentro do repo
    # ArgoCD detecta automaticamente se é Kustomize, Helm, ou plain YAML

  # DESTINATION: para onde vai
  destination:
    server: https://kubernetes.default.svc  # Cluster local (in-cluster)
    namespace: dev

  # SYNC POLICY: como sincronizar
  syncPolicy:
    # automated: habilita sync automático
    automated:
      prune: true        # Deleta recursos que foram removidos do Git
      selfHeal: true     # Corrige drift (mudanças manuais no cluster)
      allowEmpty: false  # Não sincroniza se o path está vazio (proteção)
    
    # syncOptions: opções adicionais de sync
    syncOptions:
      - CreateNamespace=true    # Cria o namespace se não existir
      - PrunePropagationPolicy=foreground  # Espera child resources serem deletados
      - PruneLast=true          # Prune acontece por último no sync
    
    # retry: configuração de retry em caso de falha
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m