# kind-config.yaml
# Cluster com ingress support e port mapping para acesso local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP - usado pelo Ingress Controller
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS - usado pelo Ingress Controller  
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort range - para acesso direto a ArgoCD se necessário
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
  - role: worker