# monitoring/argo-rollouts-servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-rollouts
  namespace: monitoring
  labels:
    release: monitoring       # label que o Prometheus procura
spec:
  namespaceSelector:
    matchNames:
      - argo-rollouts
  selector:
    matchLabels:
      # Label do SERVICE argo-rollouts-metrics, não do pod do controller
      # (que usa app.kubernetes.io/name: argo-rollouts, sem "-metrics").
      # Confirme com: kubectl get svc -n argo-rollouts --show-labels
      app.kubernetes.io/name: argo-rollouts-metrics
  endpoints:
    - port: metrics
      interval: 30s