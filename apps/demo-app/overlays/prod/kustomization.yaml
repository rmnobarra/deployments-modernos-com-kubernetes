# overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A base MAIS o recurso que só existe aqui
resources:
  - ../../base
  - pdb.yaml

namespace: prod
namePrefix: prod-

labels:
  - includeSelectors: false 
    pairs:
      environment: prod

# ATENÇÃO: `patches` é uma chave única do mapa. Declarar o bloco duas vezes
# no mesmo kustomization.yaml é YAML inválido — o parser aceita apenas a
# última ocorrência e os patches anteriores são silenciosamente descartados.
# Todos os patches do overlay ficam em UM único bloco.
patches:
  - path: rollout-patch.yaml
    target:
      kind: Rollout
      name: demo-app
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: demo-app


configMapGenerator:
  - name: demo-app-config
    literals:
      - LOG_LEVEL=warn
      - ENVIRONMENT=production
      - FEATURE_FLAG_NEW_UI=false

replacements:
  - source: {kind: Service, name: demo-app-stable, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.canary.stableService
  - source: {kind: Service, name: demo-app-canary, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.canary.canaryService
          - spec.strategy.canary.steps.2.analysis.args.0.value
          - spec.strategy.canary.steps.5.analysis.args.0.value
  - source: {kind: Ingress, name: demo-app, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.canary.trafficRouting.nginx.stableIngress
          - spec.strategy.canary.steps.2.analysis.args.1.value
          - spec.strategy.canary.steps.5.analysis.args.1.value
  - source: {kind: AnalysisTemplate, name: success-rate, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.canary.steps.2.analysis.templates.0.templateName
          - spec.strategy.canary.steps.5.analysis.templates.0.templateName