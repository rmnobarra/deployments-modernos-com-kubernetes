# overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A base MAIS o recurso que só existe aqui
resources:
  - ../../base
  - pdb.yaml

namespace: prod
namePrefix: prod-

labels:
  - includeSelectors: false 
    pairs:
      environment: prod

# ATENÇÃO: `patches` é uma chave única do mapa. Declarar o bloco duas vezes
# no mesmo kustomization.yaml é YAML inválido — o parser aceita apenas a
# última ocorrência e os patches anteriores são silenciosamente descartados.
# Todos os patches do overlay ficam em UM único bloco.
patches:
  - path: rollout-patch.yaml
    target:
      kind: Rollout
      name: demo-app
  - path: ingress-active-patch.yaml
    target:
      kind: Ingress
      name: demo-app


configMapGenerator:
  - name: demo-app-config
    literals:
      - LOG_LEVEL=warn
      - ENVIRONMENT=production
      - FEATURE_FLAG_NEW_UI=false

# Da Aula 08 — troca o bloco de canary (Aula 07) por este
replacements:
  - source: {kind: Service, name: demo-app, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.activeService
  - source: {kind: Service, name: demo-app-preview, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.previewService
          - spec.strategy.blueGreen.prePromotionAnalysis.args.0.value
  - source: {kind: AnalysisTemplate, name: smoke-test-bluegreen, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.prePromotionAnalysis.templates.0.templateName
  - source: {kind: AnalysisTemplate, name: success-rate-active, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.postPromotionAnalysis.templates.0.templateName
  - source: {kind: Ingress, name: demo-app, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.postPromotionAnalysis.args.0.value