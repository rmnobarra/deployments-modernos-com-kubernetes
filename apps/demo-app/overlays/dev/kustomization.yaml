# overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Referência à base
resources:
  - ../../base

# Namespace específico do ambiente
namespace: dev

# Prefixo para evitar colisão de nomes entre ambientes
namePrefix: dev-

# Labels que identificam o ambiente
labels:
  - includeSelectors: false
    pairs:
      environment: dev

# Aponta para o arquivo de patch criado acima
patches:
  - path: rollout-patch.yaml
    target:
      kind: Rollout
      name: demo-app
  - path: ingress-active-patch.yaml
    target:
      kind: Ingress
      name: demo-app

# ConfigMap gerado pelo Kustomize a partir de literais.
# O generator adiciona um sufixo de hash ao nome (demo-app-config-t9fk2m6d8b):
# quando o conteúdo muda, o nome muda, o Deployment enxerga um volume novo
# e reinicia os pods sozinho. É rollout automático em mudança de config.
configMapGenerator:
  - name: demo-app-config
    literals:
      - LOG_LEVEL=debug
      - ENVIRONMENT=development
      - FEATURE_FLAG_NEW_UI=true

images:
  - name: rmnobarra/gitops-demo
    newTag: "1.0.3-broken"

# overlays/dev/kustomization.yaml — acrescenta isto ao que já
# existe (patches: da Aula 06). Os índices steps.2 e steps.5 são os dois
# blocos de analysis na lista de steps acima — se você reordenar ou
# adicionar um step antes deles, atualize os índices aqui também.
# Da Aula 08 — troca o bloco de canary (Aula 07) por este
replacements:
  - source: {kind: Service, name: demo-app, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.activeService
  - source: {kind: Service, name: demo-app-preview, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.previewService
          - spec.strategy.blueGreen.prePromotionAnalysis.args.0.value
  - source: {kind: AnalysisTemplate, name: smoke-test-bluegreen, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.prePromotionAnalysis.templates.0.templateName
  - source: {kind: AnalysisTemplate, name: success-rate-active, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.postPromotionAnalysis.templates.0.templateName
  - source: {kind: Ingress, name: demo-app, fieldPath: metadata.name}
    targets:
      - select: {kind: Rollout}
        fieldPaths:
          - spec.strategy.blueGreen.postPromotionAnalysis.args.0.value