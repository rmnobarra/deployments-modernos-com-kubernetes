# base/rollout.yaml — substitui base/deployment.yaml
# Mesmo Deployment da Aula 03; só o que está marcado mudou.
apiVersion: argoproj.io/v1alpha1     # era apps/v1
kind: Rollout                        # era Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: rmnobarra/gitops-demo:1.0.0
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
  strategy:
    canary:
      # Services para traffic split — nomes da BASE; o overlay corrige com
      # namePrefix via replacements:, mais abaixo
      canaryService: demo-app-canary
      stableService: demo-app-stable

      # Traffic management via Nginx Ingress
      trafficRouting:
        nginx:
          stableIngress: demo-app       # nome do Ingress da base
          # Argo Rollouts cria automaticamente um Ingress canary
          # com annotation nginx.ingress.kubernetes.io/canary-weight
          additionalIngressAnnotations:
            canary-by-header: X-Canary   # Permite forçar canary via header

      # Steps com análise automática
      steps:
        - setWeight: 5
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: success-rate  # Referência ao AnalysisTemplate
            args:
              - name: ingress-name
                value: demo-app
        - setWeight: 25
        - pause: {duration: 1m}
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: ingress-name
                value: demo-app
        - setWeight: 50
        - pause: {duration: 2m}
        - setWeight: 100

      # Rollback automático configurado via AnalysisTemplate
      # Se qualquer analysis falhar → rollback