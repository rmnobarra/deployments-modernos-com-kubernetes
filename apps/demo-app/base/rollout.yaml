# base/rollout.yaml — substitui base/deployment.yaml
# Mesmo Deployment da Aula 03; só o que está marcado mudou.
apiVersion: argoproj.io/v1alpha1     # era apps/v1
kind: Rollout                        # era Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: rmnobarra/gitops-demo:1.0.0
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
  strategy:
    blueGreen:
      # Service que recebe tráfego de produção
      activeService: demo-app
      # Service que recebe tráfego de preview (para testes)
      previewService: demo-app-preview

      # Promoção automática desabilitada
      # Requer ação manual (ou AnalysisRun com sucesso)
      autoPromotionEnabled: false

      # Análise ANTES da promoção
      prePromotionAnalysis:
        templates:
          - templateName: smoke-test-bluegreen
        args:
          - name: preview-service
            value: demo-app-preview

      # Análise DEPOIS da promoção — versão do success-rate da Aula 07
      # adaptada pro blue-green (sem filtro de canary)
      postPromotionAnalysis:
        templates:
          - templateName: success-rate-active
        args:
          - name: ingress-name   # mesmo motivo da Aula 07: não é "demo-app"
            value: demo-app      # fixo, o Nginx exporta o nome já renomeado

      # Delay antes de fazer scale down da versão antiga
      # Permite rollback rápido durante este período
      scaleDownDelaySeconds: 120   # 2 minutos

      # Manter a ReplicaSet antiga após promoção
      scaleDownDelayRevisionLimit: 1

      # Anti-affinity: pods blue e green em nodes diferentes
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          weight: 100